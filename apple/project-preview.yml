name: QuotaDockPreview
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuotaDockPreview:
    type: application
    platform: iOS
    # Allowlist: history data/presentation only, no cloud client or authority.
    # No bridge, purchases, Watch or widgets.
    sources:
      - Preview/QuotaDockPreviewApp.swift
      - iOS/FirstRun.swift
      - iOS/PlanViews.swift
      - iOS/QuotaHistory.swift
      - iOS/CloudHistoryDetails.swift
      - Shared/Snapshot.swift
      - Shared/QuotaAlerts.swift
      - Shared/CacheFiles.swift
      - Shared/AccountSurface.swift
      - Shared/SnapshotStore.swift
      - Shared/QuotaViews.swift
      - Shared/ProviderIcon.swift
      - Shared/Localization.swift
      - Resources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotadock.app.preview
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) QUOTADOCK_UI_PREVIEW
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: GeneratedPreview/Info.plist
      properties:
        CFBundleDisplayName: Allowmark Preview
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  QuotaDockPreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Preview/UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotadock.app.preview.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QuotaDockPreview
schemes:
  QuotaDockPreview:
    build:
      targets:
        QuotaDockPreview: all
    test:
      targets: [QuotaDockPreviewUITests]
