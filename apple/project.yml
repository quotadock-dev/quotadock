name: QuotaDock
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    BUNDLE_PREFIX: com.quotadock.app
    APP_GROUP: group.com.quotadock.app
    KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(BUNDLE_PREFIX).bridge
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targetTemplates:
  shared:
    sources:
      - Shared/Snapshot.swift
      - Shared/QuotaAlerts.swift
      - Shared/CacheFiles.swift
      - Shared/AccountSurface.swift
      - Shared/WatchTransfer.swift
      - Shared/SnapshotStore.swift
      - Shared/QuotaViews.swift
      - Shared/ProviderIcon.swift
      - Shared/WidgetContent.swift
      - Shared/WatchContent.swift
      - Shared/Localization.swift
      - Resources
      - Assets.xcassets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    info:
      properties:
        AppGroup: $(APP_GROUP)
  widget:
    type: app-extension
    sources:
      - Widgets
    info:
      properties:
        CFBundleDisplayName: Allowmark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
targets:
  QuotaDock:
    templates: [shared]
    type: application
    platform: iOS
    sources: [iOS, Shared/Bridge.swift, Shared/WatchSync.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Allowmark
        KeychainGroup: $(KEYCHAIN_GROUP)
        CloudKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_PREFIX).cloud
        CFBundleURLTypes:
          - CFBundleURLName: com.quotadock.app.account
            CFBundleURLSchemes: [quotadock]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Generated/iOS.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [$(APP_GROUP)]
        keychain-access-groups: [$(KEYCHAIN_GROUP), $(AppIdentifierPrefix)$(BUNDLE_PREFIX).cloud]
    dependencies:
      - target: QuotaDockWidgets
        embed: true
      - target: QuotaDockWatch
        embed: true
  QuotaDockWidgets:
    templates: [shared, widget]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).widgets
    info:
      path: Generated/Widgets-Info.plist
    entitlements:
      path: Generated/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
  QuotaDockWatch:
    templates: [shared]
    type: application
    platform: watchOS
    sources: [Watch, Shared/WatchSync.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watch
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Allowmark
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX)
    entitlements:
      path: Generated/Watch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - target: QuotaDockWatchWidgets
        embed: true
  QuotaDockWatchWidgets:
    templates: [shared, widget]
    platform: watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watch.widgets
    info:
      path: Generated/WatchWidgets-Info.plist
    entitlements:
      path: Generated/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
  QuotaDockTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, PortableTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QuotaDock
  QuotaDockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QuotaDock
schemes:
  QuotaDock:
    build:
      targets:
        QuotaDock: all
    test:
      targets: [QuotaDockTests, QuotaDockUITests]
